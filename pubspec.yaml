name: xue_hua_navite_drag_drop
description: "A cross-platform Flutter plugin for native drag-in of files/folders and drag-out of local or async files across macOS, Windows, Linux, iOS, Android, and Web."
version: 1.0.6
homepage: https://github.com/Matkurban
repository: https://github.com/Matkurban/xue_hua_navite_drag_drop

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_navite_drag_drop
        pluginClass: XueHuaNaviteDragDropPlugin
      ios:
        pluginClass: XueHuaNaviteDragDropPlugin
      linux:
        pluginClass: XueHuaNaviteDragDropPlugin
      macos:
        pluginClass: XueHuaNaviteDragDropPlugin
      windows:
        pluginClass: XueHuaNaviteDragDropPluginCApi
      web:
        pluginClass: XueHuaNaviteDragDropWeb
        fileName: xue_hua_navite_drag_drop_web.dart
